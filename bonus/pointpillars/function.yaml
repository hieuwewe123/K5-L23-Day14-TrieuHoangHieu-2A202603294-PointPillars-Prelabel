metadata:
  name: pp-2a202603294
  namespace: nuclio
  annotations:
    name: PointPillars 2A202603294 CPU
    type: detector
    supported_shape_types: cuboid
    spec: |
      [{"id":1,"name":"Car","type":"cuboid"},{"id":2,"name":"Truck","type":"cuboid"},{"id":3,"name":"Bus","type":"cuboid"},{"id":4,"name":"Cyclist","type":"cuboid"},{"id":5,"name":"Pedestrian","type":"cuboid"}]
spec:
  description: VF LiDAR binary PCD to PointPillars cuboids on CPU
  runtime: python:3.10
  handler: main:handler
  eventTimeout: 120s
  build:
    baseImage: python:3.10-slim
    directives:
      preCopy:
        - kind: RUN
          value: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir numpy==2.1.3
        - kind: RUN
          value: pip install --no-cache-dir torch==2.5.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
  triggers:
    http:
      kind: http
      numWorkers: 1
      attributes:
        maxRequestBodySize: 33554432
        port: 32014
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
  readinessTimeoutSeconds: 120
